<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>music app</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <video src="bg-video.mp4" muted autoplay loop id="bg-video"></video>
      <div class="bgvideo"></div>
      <!-- main playlist starts from here -->
      <div class="playlist_0">
        
      </div>
      <!-- main playlist ends here -->
      <div class="combine">
        <!-- music playlist start from here -->
        <div class="playlist">
          
        </div>
        <!-- music playlist ends here -->
        <!-- music track starts from here -->
        <div class="track">
          <div class="play">
            <div class="seek">
              <input type="range" name="seek" id="Seek" min="0" max="100" value="0" />
              <p><span class="s1">00:00</span><span class="s2">00:00
              </span></p>
            </div>
            <div class="playbtn">
              <i class="fa-solid fa-play" id="playbutton"></i>
            </div>
          </div>
          <div class="song_name">
            <div class="songname">
              <img
                src="https://thumbs.dreamstime.com/b/black-vinyl-record-lp-album-disc-black-vinyl-record-lp-album-disc-isolated-transparent-background-long-play-disk-129566327.jpg"
                alt="img" id="playtrack-img"
              />
              <div class="artist">
                <div class="marquee1">
                  <div id="marquee"></div>
                </div>
                <p id="artists_name"></p>
              </div>
            </div>
            <i class="fa-regular fa-heart" id="heart"></i>
          </div>
        </div>
        <!-- music track ends here -->
      </div>
    </div>
    <script
      src="https://kit.fontawesome.com/08ce2c1922.js"
      crossorigin="anonymous"
    ></script>
    <!-- <script src="playlistHandling.js" type="module"></script> -->
    <script src="script.js" type="module"></script>
  </body>
</html>
