<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>music app</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <video src="bg-video.mp4" muted autoplay loop id="bg-video"></video>
      <div class="bgvideo"></div>
      <!-- main playlist starts from here -->
      <div class="playlist_0">
        
      </div>
      <!-- main playlist ends here -->
      <div class="combine">
        <!-- music playlist start from here -->
        <div class="playlist">
          
        </div>
        <!-- music playlist ends here -->
        <!-- music track starts from here -->
        <div class="track">
          <div class="play">
            <div class="seek">
              <input type="range" name="seek" id="Seek" min="0" max="100" value="0" />
              <p><span class="s1">2:15</span><span class="s2">3:15</span></p>
            </div>
            <div class="playbtn">
              <i class="fa-solid fa-play playbutton"></i>
            </div>
          </div>
          <div class="song_name">
            <div class="songname">
              <img
                src="https://i.scdn.co/image/ab67616d0000b273da50894e074ecd5ce61de0a1"
                alt="tamasha" id="playtrack-img"
              />
              <div class="artist">
                <marquee behavior="scroll" direction="left"
                  >Agar Tum Saath Ho - Tamasha</marquee
                >
                <p>alka yagnik,arijit singh</p>
              </div>
            </div>
            <i class="fa-regular fa-heart"></i>
          </div>
        </div>
        <!-- music track ends here -->
      </div>
    </div>
    <script
      src="https://kit.fontawesome.com/08ce2c1922.js"
      crossorigin="anonymous"
    ></script>
    <script src="script.js" type="module"></script>
    <script src="playlistHandling.js" type="module"></script>
  </body>
</html>
