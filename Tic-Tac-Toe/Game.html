<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="Style.css" />
    <link rel="stylesheet" href="MediaQuery.css">
  </head>
  <body>
    <div class="maincontainer">
      <div class="firstcontainer">
        <h3>Tic Tac Toe</h3>
        <div class="container">
          <div class="line"></div>
          <div class="box bt-0 bl-0"></div>
          <div class="box bt-0"></div>
          <div class="box bt-0 br-0"></div>
          <div class="box bl-0"></div>
          <div class="box"></div>
          <div class="box br-0"></div>
          <div class="box bb-0 bl-0"></div>
          <div class="box bb-0"></div>
          <div class="box bb-0 br-0"></div>
        </div>
      </div>
      <div class="gameData">
        <div class="btns"> 
            <h4>Turn&nbsp;&nbsp;<span id="span">X</span></h4>
            <button id="reset">reset</button>
        </div>
        <div class="gif">
            <img src="excited.gif" alt="img">
        </div>
      </div>
    </div>
  </body>
  <script
      src="https://kit.fontawesome.com/08ce2c1922.js"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
</html>
